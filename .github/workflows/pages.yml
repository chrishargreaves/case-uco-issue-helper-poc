name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Do not cancel a deployment part-way through; queue the next one instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Builds and tests with read-only access; only the deploy job can publish.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # No dependency needs an install script.
      - run: npm ci --ignore-scripts

      - run: npm test

      - name: Check the index is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('data/index.json', 'utf8'))"

      # Publish only the files the page needs, not the plan, tests or scripts.
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html assets src data _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
